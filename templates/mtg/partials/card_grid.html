{% for card in cards %}
<div class="col-md-4 mb-4">
    <div class="card custom-card-style card-hover">
        <a href="{{ url_for('mtg.card_detail', card_id=card.id) }}" class="card-link text-decoration-none text-dark">
            {% if card.local_image_path %}
            <img src="/{{ card.local_image_path }}" class="card-img-top custom-card-style" alt="{{ card.name }}">
            {% else %}
            <div class="card-img-top bg-secondary text-white d-flex align-items-center justify-content-center"
                style="height: 300px;">
                No Image Available
            </div>
            {% endif %}
            <div class="card-body">
                <h5 class="card-title">{{ card.name }}</h5>
                <p class="card-text">{{ card.type_line }}</p>
            </div>
        </a>
        <div class="card-body pt-0">
            <form method="post" action="{{ url_for('mtg.add_to_inventory') }}">
                <input type="hidden" name="id" value="{{ card.id }}">
                <button type="submit" class="btn btn-dark">Add to Inventory</button>
            </form>
        </div>
    </div>
</div>
{% endfor %}
