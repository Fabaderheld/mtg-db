{% extends "mtg/base.html" %}

{% block content %}
<h1 class="mb-4">MTG Inventory</h1>
<button class="btn btn-dark my-2 my-sm-0" type="submit">Import</button>
<table class="table mt-4">
    <thead>
        <tr>
            <th>Image</th>
            <th>Card Name</th>
            <th>Set</th>
            <th>Quantity</th>
        </tr>
    </thead>
    <tbody>
        {% for item in inventory %}
        <tr>
            <td>
                {% if item.card.local_image_path %}
                <img src="/{{ item.card.local_image_path }}" style="max-height: 50px;" alt="{{ item.card.name }}"
                    data-image="{{ url_for('static', filename=item.card.local_image_path.replace('static/', '')) }}">
                {% else %}
                <div
                    style="width: 100px; height: 100px; background-color: #f0f0f0; display: flex; align-items: center; justify-content: center;">
                    No Image
                </div>
                {% endif %}
            </td>
            <td>
                <a href="{{ url_for('mtg.card_detail', card_id=item.card.id) }}">
                    {{ item.card.name }}
                </a>
            </td>
            <td><img src="{{ url_for('static', filename=item.card.set.local_icon_path) }}" style="max-height: 25px;"> {{
                item.card.set.name }}
            </td>
            <td>{{ item.quantity }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const tooltip = document.createElement('div');
        tooltip.classList.add('card-preview-tooltip');
        document.body.appendChild(tooltip);

        document.querySelectorAll('[data-image]').forEach(link => {
            link.addEventListener('mouseover', function (event) {
                const imageURL = this.getAttribute('data-image');
                if (imageURL) {
                    const img = new Image();
                    tooltip.innerHTML = 'Loading...';
                    tooltip.style.display = 'block';
                    updateTooltipPosition(event);

                    img.onload = function () {
                        tooltip.innerHTML = '';
                        tooltip.appendChild(img);
                    };
                    img.onerror = function () {
                        tooltip.innerHTML = 'Image failed to load';
                    };
                    img.src = imageURL;
                }
            });

            link.addEventListener('mousemove', updateTooltipPosition);

            link.addEventListener('mouseout', function () {
                tooltip.style.display = 'none';
            });
        });

        function updateTooltipPosition(event) {
            const tooltipRect = tooltip.getBoundingClientRect();
            const viewportWidth = window.innerWidth;
            const viewportHeight = window.innerHeight;

            let left = event.pageX + 20;
            let top = event.pageY + 20;

            if (left + tooltipRect.width > viewportWidth) {
                left = event.pageX - tooltipRect.width - 20;
            }
            if (top + tooltipRect.height > viewportHeight) {
                top = event.pageY - tooltipRect.height - 20;
            }

            tooltip.style.left = left + 'px';
            tooltip.style.top = top + 'px';
        }
    });
</script>
{% endblock %}
