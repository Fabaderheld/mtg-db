{% extends "mtg_base.html" %}

{% block content %}
<h1>MTG Inventory</h1>
<table class="table">
    <thead>
        <tr>
            <th>Card Name</th>
            <th>Set</th>
            <th>Quantity</th>
        </tr>
    </thead>
    <tbody>
        {% for item in inventory %}
        <tr>
            <td>{{ item.card.name }}</td>
            <td>{{ item.card.set.name }}</td>
            <td>{{ item.quantity }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
